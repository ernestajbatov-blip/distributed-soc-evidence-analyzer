apiVersion: batch/v1
kind: Job
metadata:
  name: dsoc-evidence-analyzer
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: dsoc-evidence-analyzer
    spec:
      restartPolicy: Never
      containers:
        - name: analyzer
          image: dsoc-evidence-analyzer:latest
          imagePullPolicy: Never
          args: ["data/sample_runs.csv"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
