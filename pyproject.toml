[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dsoc-evidence-analyzer"
version = "0.1.0"
description = "Small research software module for evaluating Distributed SOC experiment results."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ernest Aibatov" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
dsoc-evidence = "dsoc_evidence_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dsoc_evidence_analyzer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
